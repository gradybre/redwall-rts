name: Tests

# The repository has a large headless suite that nothing ran automatically
# until this workflow existed. See tools/run_tests.sh for why passing is
# asserted on the runner's summary line rather than on godot's exit status.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  godot:
    name: Godot headless suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # docs/ENVIRONMENT.md: 4.7 is the only version anything has been run
      # against. Pin it rather than tracking latest, so an engine release
      # cannot turn a green branch red without a commit.
      GODOT_VERSION: "4.7.2"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache the Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          release="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${release}.zip"
          mkdir -p "$HOME/godot-bin"
          curl -fsSL --retry 3 -o /tmp/godot.zip "$url"
          unzip -q /tmp/godot.zip -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/${release}" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"

      - name: Put Godot on PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Report the engine version
        run: godot --version

      - name: Import the project
        # Generates godot/.godot. Without it the first --script run imports on
        # the fly, which is slower and mixes import errors into test output.
        run: godot --headless --path godot --editor --quit

      - name: Run the suite
        run: ./tools/run_tests.sh

      - name: Component stream preflight fault injection
        run: python3 tools/test_component_stream_preflights.py

      - name: Needs metadata preflight fault injection
        run: python3 tools/test_needs_metadata_preflights.py

      - name: Priorities metadata preflight fault injection
        run: python3 tools/test_priorities_metadata_preflights.py

      - name: Schedule metadata preflight fault injection
        run: python3 tools/test_schedule_metadata_preflights.py

      - name: Transforms metadata preflight fault injection
        run: python3 tools/test_transforms_metadata_preflights.py

      - name: Fauna metadata preflight fault injection
        run: python3 tools/test_fauna_metadata_preflights.py

      - name: Work metadata preflight fault injection
        run: python3 tools/test_work_metadata_preflights.py
      - name: ResourceNodes metadata preflight fault injection
        run: python3 tools/test_resource_nodes_metadata_preflights.py
      - name: Injury metadata preflight fault injection
        run: python3 tools/test_injury_metadata_preflights.py
      - name: Residents metadata preflight fault injection
        run: python3 tools/test_residents_metadata_preflights.py
      - name: FieldPolicy metadata preflight fault injection
        run: python3 tools/test_field_policy_metadata_preflights.py
      - name: Farming metadata preflight fault injection
        run: python3 tools/test_farming_metadata_preflights.py
      - name: Fishing metadata preflight fault injection
        run: python3 tools/test_fishing_metadata_preflights.py
      - name: Movement metadata preflight fault injection
        run: python3 tools/test_movement_metadata_preflights.py
      - name: Buildings metadata preflight fault injection
        run: python3 tools/test_buildings_metadata_preflights.py
      - name: Buildings borrowed-buffer allocation discriminator
        run: python3 tools/test_buildings_allocation.py

      - name: Construction source and schema fault injection
        run: python3 tools/test_construction_metadata_preflights.py

      - name: Construction borrowed-buffer allocation discriminator
        run: python3 tools/test_construction_allocation.py

      - name: Starter structures metadata fault injection
        run: python3 tools/test_starter_structures_metadata.py

      - name: UI refinement contract
        # This one hashes PNGs and asserts their magic bytes. *.png is LFS, so
        # it runs in this job, whose checkout already sets lfs: true, rather
        # than in `contracts`. Putting it there passed locally and failed on
        # the runner, where the files are pointer text: adding lfs: true to a
        # second checkout would pay LFS bandwidth twice per pull request.
        run: python3 docs/validation/ui_refinement_contract.py

      - name: Check the copied hash kernel against the engine
        # ready07_addendum_checks is pure arithmetic without --godot; the flag
        # is what makes it compile the copied production kernel and compare
        # digests, which is the half that needs a binary. It runs here rather
        # than in `contracts` so it does not pay for a second Godot download.
        run: python3 docs/validation/ready07_addendum_checks.py --godot

  contracts:
    name: Specification contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # These validators existed and passed long before anything ran them
    # automatically: they were invoked by hand, which means they were invoked
    # when someone remembered. The memory ledger in particular has been wrong
    # on master more than once between hand runs. Nothing here needs the
    # engine and none of it touches Git LFS, so it fails in under a minute
    # instead of behind a 30-minute job and needs no LFS checkout.
    #
    # Deliberately excluded: validate_blocker_package.py and
    # validate_executor_followup.py, which are report GENERATORS. They always
    # exit 0 and they rewrite tracked JSON, so running them in CI would prove
    # nothing and dirty the tree. arithmetic/qualify/run_headless/setting_contract/
    # winter all require an --output path and are likewise generators.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Decision numbers are unique and match their headings
        run: python3 docs/validation/decision_numbers.py

      - name: Memory ledger arithmetic
        run: python3 docs/validation/ready07_arithmetic.py

      - name: Merge gate (ledger chain, double budgets, row arithmetic)
        run: python3 docs/validation/merge_gate.py

      - name: Dispatch graph is well formed
        run: python3 tools/dispatch_plan.py --validate

      - name: Astra inbox index is current
        run: python3 tools/astra_inbox.py --check

      # The check that catches an implemented-but-undeclared packed column. It was
      # NOT in CI, which is how seventeen construction.gd columns reached master
      # classified as persistent state and absent from the canonical registry --
      # found by Astra reading the tree, not by any gate. --source-root is the
      # half that compares the registry against the actual GDScript; without it
      # the run only checks the artifact against itself.
      - name: Canonical registry matches the source it claims to describe
        run: python3 docs/validation/validate_save_registry_handoff.py --source-root .

      # The compiled declaration table was hand-maintained for 590 entries and had
      # already drifted from the registry before a generator existed.
      - name: Compiled declaration table is regenerable from the registry
        run: python3 tools/generate_canonical_state_table.py --check

      # NONE of the cycle handoff validators ran in CI until now. validate_cycle01_handoff had
      # been failing since Cycle 2 answered two of its inbox items, and nothing noticed: it was
      # only ever invoked by hand during its own transfer. A validator outside CI is a validator
      # that passes until someone remembers it, which is how the memory ledger went wrong on
      # master more than once before its own check was automated.
      - name: Astra cycle handoff contracts
        run: |
          set -euo pipefail
          python3 docs/validation/validate_cycle01_handoff.py
          python3 docs/validation/validate_cycle02_handoff.py
          python3 docs/validation/validate_cycle03_handoff.py --source-root .

      # The capacity sidecar must stay regenerable and in step with the registry it audits.
      - name: Registry capacity audit sidecar
        run: |
          set -euo pipefail
          python3 tools/audit_registry_capacities.py --check
          python3 tools/test_registry_capacity_audit.py

      - name: Component column schema matches source capacities
        run: |
          set -euo pipefail
          python3 tools/generate_component_columns_schema.py --check
          python3 tools/test_component_columns_schema.py

      - name: Lane records are one file each, not appended to a shared checklist
        run: python3 tools/lane_notes.py --check

      # MOVE-C2-R01's fit arithmetic. Its load-bearing property is that a negative
      # translated minimum reports PLACEMENT_INCOMPATIBLE_AT_OFFSET and never
      # CLEARANCE_CLASS_EXCEEDS_DOMAIN -- no clearance class repairs it, because the
      # square grows south and east from its anchor. A regression there would send
      # someone hunting for a k that does not exist.
      - name: Movement envelope fit arithmetic
        run: python3 tools/test_movement_envelopes.py

      # The Q2 register's own validator_rules as executable checks: 288 leaf entries, every leaf
      # resolving to a row class, no presentation gap as a blocker, no slot carrying a value, and
      # totals equal to a recount over rows. The register is the artifact Astra rules against, so
      # a register that drifts from its own rules is a planner reading a document that lies.
      - name: Movement profile policy register
        run: python3 tools/test_movement_profile_policy.py

      - name: State registry covers every packed column
        run: python3 docs/validation/state_registry_coverage.py

      - name: Validator self-tests
        run: |
          set -euo pipefail
          python3 docs/validation/test_headless_runner.py
          python3 docs/validation/test_qualify.py
          python3 docs/validation/test_winter.py
          python3 docs/validation/test_merge_gate.py

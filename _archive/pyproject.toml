[project]
name = "redwall-rts-orchestrator"
version = "0.1.0"
description = "Multi-agent LangGraph orchestrator for the Redwall RTS colony-builder"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
redwall = "orchestrator.main:cli"

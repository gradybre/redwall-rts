; The Windows demo build's export preset (decision 0196). tools/build_demo_windows.py merges this
; into godot/export_presets.cfg, which stays gitignored and local: that file already holds a
; developer's own presets (the macOS benchmark one), so it is merged by preset NAME, renumbered, and
; never overwritten. Everything the build depends on is stated here rather than left to a default.
;
;   custom_features="demo_build"   boots res://demo/demo_village.tscn, maximized, titled "Redwall
;                                  Demo" (the feature overrides in godot/project.godot)
;   include_filter                 the JSON the scripts read with FileAccess, and the staged assets
;                                  (gitignored, but on disk); the demo's card atlases and icons are
;                                  packed as files (importer "keep", tools/demo_texture_imports.py)
;   exclude_filter                 the headless test suite, in-project tools and lookdev captures, and
;                                  the props' provenance records: none is read at run time
;   embed_pck=false                exe + pck side by side: the pack is ~0.7 GB, and a folder is the
;                                  robust shape for a zip copied to another PC
;   s3tc_bptc                      the desktop VRAM formats the 3D textures are imported to
;   modify_resources=false         no rcedit on macOS; the exe keeps Godot's icon and version info
;   export_d3d12 / export_angle=1  ship the D3D12 and ANGLE runtimes the templates carry, so the
;                                  Vulkan -> D3D12 -> OpenGL fallback chain has what it needs

[preset.0]

name="Windows Desktop (demo)"
platform="Windows Desktop"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="demo_build"
export_filter="all_resources"
include_filter="*.json, demo/assets/*"
exclude_filter="test/*, tools/*, assets/lookdev/captures/*, demo/assets/*.made.json"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="Redwall Demo"
application/file_description="Redwall RTS live demo"
application/copyright=""
application/trademarks=""
application/export_angle=1
application/export_d3d12=1
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
